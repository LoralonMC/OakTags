# ============================================================
# OakTags Messages
# ============================================================
# MiniMessage format: https://docs.advntr.dev/minimessage/format.html
#
# Placeholders: <player> - Player name, <tag> - Tag display,
#   <tag_id> - Tag ID, <amount> - Amount, <count> - Claim count
# Set text to "" to disable individual messages.
# Display modes: chat, action_bar

# ============================================================
# GAMEPLAY MESSAGES
# ============================================================
tag-equipped:
  text: "<#6C757D>[<#6B7A5E>ᴛᴀɢꜱ<#6C757D>] <#f2ebd7>Equipped tag: <tag>"
  display: chat
tag-cleared:
  text: "<#6C757D>[<#6B7A5E>ᴛᴀɢꜱ<#6C757D>] <#f2ebd7>Active tag cleared."
  display: chat
tag-already-owned:
  text: "<#6C757D>[<#6B7A5E>ᴛᴀɢꜱ<#6C757D>] <#D89B6A>You already have this tag."
  display: action_bar
voucher-redeemed:
  text: "<#6C757D>[<#6B7A5E>ᴛᴀɢꜱ<#6C757D>] <#8FAA87>Redeemed tag: <tag>"
  display: chat
tag-favorited:
  text: "<#8FAA87>Added to favorites."
  display: action_bar
tag-unfavorited:
  text: "<#D89B6A>Removed from favorites."
  display: action_bar
voucher-not-found:
  text: "<#C27B6B>Voucher no longer in hand."
  display: action_bar
voucher-invalid:
  text: "<#C27B6B>This voucher is for a tag that no longer exists."
  display: action_bar

# ============================================================
# COMMAND MESSAGES
# ============================================================
# Flat strings, always delivered via chat
commands:
  reload-success: "<#6C757D>[<#6B7A5E>ᴛᴀɢꜱ<#6C757D>] <#8FAA87>Configuration reloaded."
  reload-failed: "<#6C757D>[<#C27B6B>ᴇʀʀᴏʀ<#6C757D>] <#C27B6B>Reload failed. Check console."
  tag-given: "<#6C757D>[<#6B7A5E>ᴛᴀɢꜱ<#6C757D>] <#f2ebd7>Gave <tag> <#f2ebd7>to <#FCD472><player><#f2ebd7>."
  tag-received: "<#6C757D>[<#6B7A5E>ᴛᴀɢꜱ<#6C757D>] <#f2ebd7>You received the <tag> <#f2ebd7>tag!"
  tag-revoked: "<#6C757D>[<#6B7A5E>ᴛᴀɢꜱ<#6C757D>] <#f2ebd7>Revoked <tag> <#f2ebd7>from <#FCD472><player><#f2ebd7>."
  tag-revoked-notify: "<#6C757D>[<#6B7A5E>ᴛᴀɢꜱ<#6C757D>] <#C27B6B>Your <tag> <#C27B6B>tag was revoked."
  tag-not-found: "<#6C757D>[<#C27B6B>ᴇʀʀᴏʀ<#6C757D>] <#C27B6B>Tag not found: <#FCD472><tag_id>"
