plugins {
    id 'java'
    id("com.gradleup.shadow") version "9.3.1"
}

group = 'dev.oakheart'
version = '1.2.0'

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "placeholderapi"
        url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.1.2.build.+")
    compileOnly("me.clip:placeholderapi:2.11.6")
    compileOnly("org.xerial:sqlite-jdbc:3.47.1.0")
    implementation("org.bstats:bstats-bukkit:3.1.0")
    implementation("dev.oakheart:oakheart-core:1.2.0")
    implementation("dev.oakheart:oakheart-models:1.2.0")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

compileJava {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

shadowJar {
    relocate 'org.bstats', 'dev.oakheart.oaktags.bstats'
    relocate 'dev.oakheart.config', 'dev.oakheart.oaktags.libs.config'
    relocate 'dev.oakheart.message', 'dev.oakheart.oaktags.libs.message'
    relocate 'dev.oakheart.command', 'dev.oakheart.oaktags.libs.command'
    relocate 'dev.oakheart.util', 'dev.oakheart.oaktags.libs.util'
    relocate 'dev.oakheart.models', 'dev.oakheart.oaktags.libs.models'
    archiveClassifier.set('')
}

jar {
    archiveClassifier.set('slim')
}

tasks.assemble.dependsOn(tasks.shadowJar)
